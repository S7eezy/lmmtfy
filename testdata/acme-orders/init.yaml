# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: N_Commande
    type: integer
  - name: Date
    type: date
  - name: Montant_TTC
    type: decimal
    scale: 2
  - name: Etat
    type: string
  - name: Remarque
    type: string
input:
  encoding: windows-1252
  delimiter: ;
  header_row: 3
  skip_footer: 1
  trim: true
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 3 values, e.g. "1001", "1002", "1003"
  N_Commande:
    source: N° Commande
  # date, 100% of 3 values, formats DD/MM/YYYY, DD-MM-YYYY, e.g. "05/10/2026", "06-10-2026", "07/10/2026"
  # REVIEW: several formats in the same column
  Date:
    source: Date
    formats:
    - DD/MM/YYYY
    - DD-MM-YYYY
  # decimal, 100% of 3 values, decimal ",", thousands " ", scale 2, e.g. "1 234,50", "99,9", "12"
  Montant_TTC:
    source: Montant TTC
    decimal_sep: ","
    thousands_sep: " "
  # string, 100% of 3 values, max 1 char, e.g. "V", "A", "E"
  Etat:
    source: Etat
  # string, 100% of 2 values, max 22 chars, 1 empty, e.g. "Livraison rapide", "Client \"VIP\"; rappeler"
  Remarque:
    source: Remarque
