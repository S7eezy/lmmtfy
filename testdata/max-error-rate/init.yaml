# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: id
    type: string
  - name: date
    type: date
  - name: amount
    type: integer
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # string, 100% of 4 values, max 1 char, e.g. "1", "x", "3"
  # REVIEW: 50% of values read as integer; rejected: x, y
  id:
    source: id
  # date, 100% of 4 values, formats YYYY-MM-DD, e.g. "2026-01-01", "2026-01-02", "2026-01-03"
  date:
    source: date
    formats:
    - YYYY-MM-DD
  # integer, 100% of 4 values, e.g. "1", "2", "3"
  amount:
    source: amount
