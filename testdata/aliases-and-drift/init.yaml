# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: N_commande
    type: integer
  - name: Date_de_commande
    type: date
  - name: Amounts
    type: decimal
    scale: 1
  - name: comment
    type: string
  - name: channel
    type: string
input:
  encoding: utf-8
  delimiter: ;
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 2 values, e.g. "1", "2"
  N_commande:
    source: N° commande
  # date, 100% of 2 values, formats DD/MM/YYYY, e.g. "03/02/2024", "04/02/2024"
  # REVIEW: day/month order is ambiguous: read as DD/MM/YYYY, could be MM/DD/YYYY
  Date_de_commande:
    source: Date de commande
    formats:
    - DD/MM/YYYY
  # decimal, 100% of 2 values, decimal ".", scale 1, e.g. "12.5", "7"
  Amounts:
    source: Amounts
  # string, 100% of 1 values, max 5 chars, 1 empty, e.g. "first"
  comment:
    source: comment
  # string, 100% of 2 values, max 4 chars, e.g. "web", "shop"
  channel:
    source: channel
