# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: sku
    type: string
  - name: updated
    type: date
  - name: qty
    type: string
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # string, 100% of 6 values, max 1 char, e.g. "A", "B", "C"
  sku:
    source: sku
  # date, 100% of 6 values, formats YYYY-MM-DD, e.g. "2024-01-01", "2024-01-03", "2024-01-02"
  updated:
    source: updated
    formats:
    - YYYY-MM-DD
  # string, 100% of 6 values, max 1 char, e.g. "1", "5", "2"
  # REVIEW: 83% of values read as integer; rejected: x
  qty:
    source: qty
