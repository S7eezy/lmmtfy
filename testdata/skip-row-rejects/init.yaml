# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: id
    type: integer
  - name: date
    type: string
  - name: amount
    type: string
  - name: status
    type: string
  - name: country
    type: string
  - name: comment
    type: string
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 5 values, e.g. "1", "2", "3"
  id:
    source: id
  # string, 100% of 5 values, max 10 chars, e.g. "01/01/2026", "31/02/2026", "02/01/2026"
  # REVIEW: 80% of values read as date DD/MM/YYYY; rejected: 31/02/2026
  date:
    source: date
  # string, 100% of 5 values, max 4 chars, e.g. "10.5", "ten", "7"
  # REVIEW: 80% of values read as decimal; rejected: ten
  amount:
    source: amount
  # string, 100% of 5 values, max 1 char, e.g. "V", "X", "A"
  status:
    source: status
  # string, 100% of 5 values, max 2 chars, e.g. "fr", "be"
  country:
    source: country
  # string, 100% of 5 values, max 21 chars, e.g. "ok", "bad date", "bad amount and status"
  comment:
    source: comment
