# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: id
    type: integer
  - name: date
    type: date
  - name: amount
    type: string
  - name: status
    type: string
  - name: country
    type: string
  - name: comment
    type: string
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 3 values, e.g. "1", "2", "3"
  id:
    source: id
  # date, 100% of 3 values, formats YYYY-MM-DD, e.g. "2026-01-01", "2026-01-02", "2026-01-03"
  date:
    source: date
    formats:
    - YYYY-MM-DD
  # string, 100% of 3 values, max 7 chars, e.g. "abc", "3.14159", "1"
  # REVIEW: 67% of values read as decimal; rejected: abc
  amount:
    source: amount
  # string, 100% of 3 values, max 9 chars, e.g. "V", "whatever", "CANCELLED"
  status:
    source: status
  # string, 100% of 3 values, max 3 chars, e.g. "FRA", "de", "fr"
  country:
    source: country
  # string, 100% of 3 values, max 43 chars, e.g. "this comment is far too …", "short", "unmatched code"
  comment:
    source: comment
