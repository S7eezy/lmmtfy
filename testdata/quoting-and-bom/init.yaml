# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: ref
    type: string
  - name: note
    type: string
input:
  encoding: utf-8
  delimiter: tab
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # string, 100% of 2 values, max 2 chars, e.g. "A1", "A2"
  ref:
    source: Ref
  # string, 100% of 2 values, max 12 chars, e.g. "two\nlines", "say \"hi\" \\o/"
  note:
    source: Note
