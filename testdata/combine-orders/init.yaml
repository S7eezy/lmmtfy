# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: primarykey
    type: integer
  - name: batchid
    type: string
  - name: object
    type: string
  - name: price
    type: string
  - name: qty
    type: integer
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 10 values, e.g. "3", "1", "2"
  primarykey:
    source: primaryKey
  # string, 100% of 10 values, max 2 chars, e.g. "B1", "B2", "B3"
  batchid:
    source: batchId
  # string, 100% of 10 values, max 6 chars, e.g. "bolt", "nut", "washer"
  object:
    source: object
  # string, 100% of 10 values, max 5 chars, e.g. "0.25", "0.10", "0.05"
  # REVIEW: 90% of values read as decimal; rejected: abc
  price:
    source: price
  # integer, 100% of 10 values, e.g. "100", "200", "300"
  qty:
    source: qty
