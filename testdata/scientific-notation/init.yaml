# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: sample
    type: string
  - name: pw_std_us_1
    type: decimal
  - name: ratio
    type: decimal
input:
  encoding: utf-8
  delimiter: ;
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # string, 100% of 6 values, max 2 chars, e.g. "A1", "A2", "A3"
  sample:
    source: sample
  # decimal, 100% of 6 values, decimal ".", e.g. "0.000123", "0.0004", "1.2e-05"
  # REVIEW: scientific notation (1.2e-05, 5.419198916047157e-07): written as plain decimals with all their digits; set a scale to round them
  pw_std_us_1:
    source: pw_std_us_1
  # decimal, 100% of 6 values, decimal ".", e.g. "1.5", "2", "3.25"
  # REVIEW: scientific notation (1E+2): written as plain decimals with all their digits; set a scale to round them
  ratio:
    source: ratio
