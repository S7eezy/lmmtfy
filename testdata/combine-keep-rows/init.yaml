# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: batch
    type: string
  - name: object
    type: string
  - name: price
    type: decimal
    scale: 1
  - name: cancelled
    type: boolean
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # string, 100% of 5 values, max 2 chars, e.g. "B1", "B2", "B3"
  batch:
    source: batch
  # string, 100% of 5 values, max 6 chars, e.g. "bolt", "nut", "washer"
  object:
    source: object
  # decimal, 100% of 5 values, decimal ".", scale 1, e.g. "1.5", "2", "3"
  price:
    source: price
  # boolean, 100% of 4 values, 1 empty, e.g. "no", "yes"
  cancelled:
    source: cancelled
