# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: id
    type: integer
  - name: ts_ms
    type: integer
  - name: temp
    type: decimal
    scale: 1
  - name: unit_price
    type: decimal
    scale: 3
  - name: qty
    type: integer
  - name: first
    type: string
  - name: last
    type: string
  - name: code
    type: string
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 3 values, e.g. "1", "2", "3"
  id:
    source: id
  # integer, 100% of 3 values, e.g. "1700000000123", "1700000060000", "1700000120500"
  ts_ms:
    source: ts_ms
  # decimal, 100% of 2 values, decimal ",", scale 1, 1 empty, e.g. "21,5", "4,2"
  temp:
    source: temp
    decimal_sep: ","
  # decimal, 100% of 3 values, decimal ".", scale 3, e.g. "10.005", "2.5", "0.333"
  unit_price:
    source: unit_price
  # integer, 100% of 2 values, 1 empty, e.g. "3", "7"
  qty:
    source: qty
  # string, 100% of 3 values, max 5 chars, e.g. "Ada", "Alan", "Grace"
  first:
    source: first
  # string, 100% of 3 values, max 8 chars, e.g. "Lovelace", "Turing", "Hopper"
  last:
    source: last
  # string, 100% of 2 values, max 2 chars, 1 empty, e.g. "fr", "us"
  code:
    source: code
