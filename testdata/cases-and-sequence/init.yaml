# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: id
    type: integer
  - name: temp
    type: integer
  - name: status
    type: string
  - name: amount
    type: string
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 5 values, e.g. "1", "2", "3"
  id:
    source: id
  # integer, 100% of 4 values, 1 empty, e.g. "35", "12", "2"
  temp:
    source: temp
  # string, 100% of 5 values, max 3 chars, e.g. "ok", "bad"
  status:
    source: status
  # string, 100% of 5 values, max 4 chars, e.g. "10", "-3.5", "5"
  # REVIEW: 80% of values read as decimal; rejected: abc
  amount:
    source: amount
