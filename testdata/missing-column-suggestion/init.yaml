# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: order_id
    type: integer
  - name: ORDER_DATE
    type: date
  - name: Montant
    type: decimal
    scale: 1
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 1 values, e.g. "1"
  order_id:
    source: order_id
  # date, 100% of 1 values, formats YYYY-MM-DD, e.g. "2024-02-03"
  ORDER_DATE:
    source: ORDER_DATE
    formats:
    - YYYY-MM-DD
  # decimal, 100% of 1 values, decimal ".", scale 1, e.g. "12.5"
  Montant:
    source: Montant
