# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: column_1
    type: integer
  - name: column_2
    type: datetime
  - name: column_3
    type: boolean
  - name: column_4
    type: string
input:
  encoding: utf-8
  delimiter: ","
  header: false
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 3 values, thousands ".", e.g. "1.250", "12", "7"
  # REVIEW: "." read as a thousands separator; if the values are decimals, set decimal_sep: "."
  column_1:
    source_index: 1
    thousands_sep: .
  # datetime, 100% of 3 values, formats DD/MM/YYYY HH:mm, e.g. "15/07/2026 14:30", "15/01/2026 08:00"
  column_2:
    source_index: 2
    formats:
    - DD/MM/YYYY HH:mm
  # boolean, 100% of 3 values, true "oui", false "non", e.g. "oui", "NON"
  column_3:
    source_index: 3
    true_values:
    - oui
    false_values:
    - non
  # string, 100% of 3 values, max 5 chars, e.g. "first", "N/A", "-"
  column_4:
    source_index: 4
