# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: name
    type: string
  - name: name_2
    type: string
  - name: other
    type: string
# REVIEW: 2 of 3 sampled rows do not have 3 fields: ragged_rows set to lenient
# REVIEW: duplicate header names: they are numbered (Name, Name_2, ...)
input:
  encoding: utf-8
  delimiter: ","
  ragged_rows: lenient
  duplicate_headers: suffix
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # string, 100% of 3 values, max 1 char, e.g. "a", "d", "f"
  name:
    source: Name
  # string, 100% of 3 values, max 1 char, e.g. "b", "e", "g"
  name_2:
    source: Name_2
  # string, 100% of 2 values, max 1 char, e.g. "c", "h"
  other:
    source: Other
