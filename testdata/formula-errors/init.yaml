# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: id
    type: integer
  - name: total
    type: string
  - name: qty
    type: integer
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 4 values, e.g. "1", "2", "3"
  id:
    source: id
  # string, 100% of 4 values, max 3 chars, e.g. "10", "abc", "9"
  # REVIEW: 75% of values read as integer; rejected: abc
  total:
    source: total
  # integer, 100% of 4 values, e.g. "2", "0", "1"
  qty:
    source: qty
