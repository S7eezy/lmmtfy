# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: sensor
    type: string
  - name: read_at
    type: datetime
  - name: value
    type: string
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # string, 100% of 5 values, max 1 char, e.g. "A", "B", "C"
  sensor:
    source: sensor
  # datetime, 100% of 4 values, formats YYYY-MM-DD HH:mm, 1 empty, e.g. "2024-03-02 10:00", "2024-03-01 08:30", "2024-03-05 18:00"
  read_at:
    source: read_at
    formats:
    - YYYY-MM-DD HH:mm
  # string, 100% of 4 values, max 4 chars, 1 empty, e.g. "12.5", "7", "9.25"
  # REVIEW: 75% of values read as decimal; rejected: abc
  value:
    source: value
