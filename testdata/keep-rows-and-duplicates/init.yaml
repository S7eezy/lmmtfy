# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: id
    type: integer
  - name: status
    type: string
  - name: amount
    type: string
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 7 values, e.g. "1", "2", "3"
  id:
    source: id
  # string, 100% of 6 values, max 4 chars, 1 empty, e.g. "OK", "TEST"
  status:
    source: status
  # string, 100% of 7 values, max 3 chars, e.g. "10", "abc", "11"
  # REVIEW: 71% of values read as decimal; rejected: abc
  amount:
    source: amount
