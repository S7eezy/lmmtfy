# Draft mapping generated by lmmtfy init from input.csv.
# Review it before use: target column names and types, and the target
# output format, which must match the software that reads the files.
version: 1
name: input
description: Draft generated by lmmtfy init from input.csv
target:
  output:
    encoding: utf-8
    delimiter: ","
    line_ending: crlf
  columns:
  - name: id
    type: integer
  - name: date
    type: date
  - name: amount
    type: string
  - name: comment
    type: string
input:
  encoding: utf-8
  delimiter: ","
on_error:
  strategy: fail_file
  reject_file: true
columns:
  # integer, 100% of 3 values, e.g. "1", "2", "3"
  id:
    source: id
  # date, 100% of 3 values, formats YYYY-MM-DD, e.g. "2026-01-01", "2026-01-02", "2026-01-03"
  date:
    source: date
    formats:
    - YYYY-MM-DD
  # string, 100% of 3 values, max 3 chars, e.g. "1.5", "1;5", "2"
  # REVIEW: 67% of values read as decimal; rejected: 1;5
  amount:
    source: amount
  # string, 100% of 3 values, max 13 chars, e.g. "ok", "bad amount", "never reached"
  comment:
    source: comment
