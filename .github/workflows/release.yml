# Pushing a version tag publishes a GitHub Release:
#
#   git tag v1.0.0 && git push origin v1.0.0
#
# Linux builds the CLI for every platform and Studio for Windows and Linux,
# macOS builds the universal Studio app; the archives are then published
# together with one SHA256SUMS. A tag with a suffix (v1.1.0-rc1) makes a
# pre-release.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev
      - run: make check
      - run: make smoke VERSION=$VERSION
      - run: make dist VERSION=$VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: archives-linux
          path: dist/release/*
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: make studio-macos VERSION=$VERSION
      - run: go run ./tools/release -version $VERSION -dist dist
      - uses: actions/upload-artifact@v4
        with:
          name: archives-macos
          path: dist/release/*
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [linux, macos]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: archives-*
          path: release
          merge-multiple: true
      # Each build job wrote checksums of its own archives: one file for all.
      - name: Checksums
        working-directory: release
        run: |
          rm -f SHA256SUMS
          sha256sum *.zip *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$VERSION" release/* \
            --repo "$GITHUB_REPOSITORY" --title "lmmtfy $VERSION" \
            --generate-notes --verify-tag "${flags[@]}"
